# AI Card Game Lab - 系统配置
# 此文件提供默认配置值，环境变量优先级更高

app:
  name: "AI Card Game Lab"
  debug: true
  host: "0.0.0.0"
  port: 8000

game:
  default_mode: "realtime"
  max_rounds: 200
  round_timeout_ms: 30000
  supported_types:
    - doudizhu

ai:
  default_provider: "deepseek"
  default_temperature: 0.8
  default_top_p: 0.95
  default_max_tokens: 1024
  thinking_enabled: true
  retry_count: 3
  retry_delay_ms: 1000

data:
  jsonl_dir: "data/games"
  sqlite_dir: "data/db"
  dataset_dir: "data/datasets"

training:
  output_dir: "models"
  default_base_model: "Qwen/Qwen2.5-1.5B"
  default_learning_rate: 0.00002
  default_batch_size: 8
  default_num_epochs: 3
