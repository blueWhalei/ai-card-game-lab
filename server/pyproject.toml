[tool.poetry]
name = "ai-card-game-lab"
version = "0.1.0"
description = "AI 卡牌游戏实验数据采集与训练平台"
authors = ["blueWhalei"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.34.0"}
pydantic-settings = ">=2.7.0"
aiosqlite = ">=0.20.0"
structlog = ">=24.0.0"
pyyaml = ">=6.0"
psutil = ">=5.9.0"
mcp = "^2.2.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.8.0"
mypy = ">=1.13.0"
pytest = ">=8.0.0"
pytest-asyncio = ">=0.24.0"
pytest-cov = ">=5.0.0"
httpx = ">=0.27.0"

# Optional: real LoRA SFT (poetry install --with training)
[tool.poetry.group.training]
optional = true

[tool.poetry.group.training.dependencies]
torch = ">=2.2.0"
transformers = ">=4.44.0"
peft = ">=0.12.0"
datasets = ">=2.20.0"
accelerate = ">=0.33.0"
safetensors = ">=0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ── Ruff ──────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "RUF001",  # 中文文案允许全角标点/同形字符
    "RUF002",  # 中文文档中允许使用全角标点
    "RUF003",  # 中文注释允许全角标点
    "B008",    # FastAPI Depends pattern is standard
    "E501",    # 中文错误信息/注释常超 100；靠人工与 review 控可读性
    # FastAPI / Pydantic need these imports at runtime for Depends/body models.
    "TC001",
    "TC002",
    "TC003",
    # Style nits kept out of CI until a dedicated cleanup pass.
    "SIM105",
    "SIM108",
    "SIM117",
    "SIM102",
    "RUF015",
    "RUF005",
    "RUF012",
    "RUF059",
    "B007",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Training stack (optional extras + third-party stubs) — out of CI gate for now.
[[tool.mypy.overrides]]
module = [
    "app.core.training",
    "app.core.training.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "peft",
    "peft.*",
    "datasets",
    "datasets.*",
    "accelerate",
    "accelerate.*",
    "bitsandbytes",
    "bitsandbytes.*",
    "safetensors",
    "safetensors.*",
]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true
